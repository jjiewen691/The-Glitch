.menu-wrap{display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 6vw;max-width:640px}
.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(52px,9vw,104px);line-height:.95;
  letter-spacing:2px;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.title small{display:block;font-size:.28em;letter-spacing:10px;color:var(--gold);margin-top:14px;font-family:inherit}
.menubtns{display:flex;flex-direction:column;gap:14px;margin-top:48px;width:min(320px,80vw)}
.mbtn{text-align:left;padding:14px 22px;font-size:19px;background:rgba(29,23,18,.85);border:1px solid var(--line);
  border-left:4px solid var(--gold);transition:all .15s;font-weight:600}
.mbtn:hover{background:var(--panel2);border-left-color:var(--purple);transform:translateX(6px)}
.mbtn .sub{display:block;font-size:12px;color:var(--txt2);font-weight:400;margin-top:2px}
.menu-foot{margin-top:36px;font-size:13px;color:var(--txt2);line-height:1.7}

/* ===== 通用面板 ===== */
.panel-screen{background:rgba(8,6,5,.94);padding:5vh 6vw;overflow-y:auto}
.panel-head{display:flex;align-items:center;gap:18px;margin-bottom:28px}
.panel-head h2{font-family:Georgia,serif;font-size:38px;letter-spacing:2px}
.back{padding:10px 18px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.back:hover{border-color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:20px}.card p{font-size:13.5px;color:var(--txt2);line-height:1.6;flex:1}
.tag{font-size:12px;padding:3px 9px;border:1px solid var(--line);color:var(--gold);align-self:flex-start}
.bigbtn{padding:12px;font-size:16px;font-weight:700;background:var(--wood);border:1px solid var(--line)}
.bigbtn:hover{background:#4d3726}
.bigbtn:disabled{opacity:.4;cursor:not-allowed}
.bigbtn.purple{background:#3d2a6b;border-color:#5b3fa8}
.bigbtn.purple:hover{background:#4c3585}
.bigbtn.red{background:#5c2020;border-color:#8a3030}
.price{color:var(--gold);font-weight:700;font-size:17px}
.own{color:var(--green);font-size:13px}
.locked{opacity:.45}

/* ===== 設定 ===== */
.setrow{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center;max-width:680px;
  padding:16px 0;border-bottom:1px solid var(--line)}
.setrow label{font-size:16px;color:var(--txt2)}
.setval{font-size:14px;color:var(--gold);min-width:52px;text-align:right}
.setline{display:flex;gap:12px;align-items:center}
.toggle{padding:8px 18px;border:1px solid var(--line);background:var(--panel)}
.toggle.on{background:#3d2a6b;border-color:var(--purple)}

/* ===== HUD ===== */
#hud{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
#hud.on{display:block}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(255,255,255,.85)}
#cross::before{left:8px;top:2px;width:2px;height:14px}
#cross::after{left:2px;top:8px;width:14px;height:2px}
#topbar{position:absolute;top:18px;left:18px;display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(20,17,15,.82);border:1px solid var(--line);padding:8px 14px;font-size:15px;font-weight:700}
.chip b{color:var(--gold)}
#adminBtn{position:absolute;top:16px;right:18px;pointer-events:auto;width:58px;height:58px;padding:6px;
  background:rgba(20,17,15,.85);border:1px solid #5b3fa8;display:none}
#adminBtn.on{display:block}
#adminBtn img{width:100%;height:100%;image-rendering:pixelated}
#bars{position:absolute;left:18px;bottom:22px;width:min(300px,42vw);display:flex;flex-direction:column;gap:8px}
.bar{height:15px;background:rgba(0,0,0,.6);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left}
#hpFill{background:linear-gradient(90deg,#b91c1c,#ef4444)}
#shFill{background:linear-gradient(90deg,#4c3585,#8b5cf6)}
.bar span{position:absolute;inset:0;font-size:11px;text-align:center;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000}
#inv{position:absolute;right:18px;bottom:22px;display:flex;gap:8px}
.slot{width:66px;height:66px;background:rgba(20,17,15,.82);border:1px solid var(--line);position:relative;
  display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;color:var(--txt2);padding:4px}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.slot b{position:absolute;top:2px;left:5px;font-size:11px;color:var(--txt)}
.slot em{position:absolute;bottom:2px;right:5px;font-style:normal;font-size:11px;color:var(--gold)}
#prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,17,15,.9);
  border:1px solid var(--line);padding:10px 22px;font-size:16px;display:none}
#prompt.on{display:block}
#prompt b{color:var(--gold)}
#buff{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:flex;gap:8px}
.buffchip{background:rgba(20,17,15,.85);border:1px solid var(--line);padding:6px 12px;font-size:13px;display:none}
.buffchip.on{display:block}
#nsb{position:absolute;right:18px;top:92px;width:280px;background:rgba(20,17,15,.9);border:1px solid #2f6b58;
  padding:14px;font-size:13px;line-height:1.6;display:none}
#nsb.on{display:block}
#nsb h4{color:var(--green);font-size:14px;margin-bottom:6px}
#hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(20,17,15,.85);
  border:1px solid var(--line);padding:10px 20px;font-size:13px;color:var(--txt2);transition:opacity 1s}
/* 警告粒子邊框 */
#particles{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}
#particles.on{display:block}
#warnTxt{position:fixed;z-index:7;left:50%;top:22%;transform:translateX(-50%);font-size:26px;font-weight:800;
  letter-spacing:4px;display:none;text-shadow:0 0 24px currentColor}
#warnTxt.on{display:block}
#glitchFlash{position:fixed;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
/* ===== 暫停 / 死亡 / 勝利 ===== */
.overlay{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
background:rgba(5,4,3,.88);text-align:center;padding:24px;overflow-y:auto}
.overlay.on{display:flex}
.ov-btns{display:flex;gap:12px;flex-wrap:wrap;justify:center;margin-top:22px}
.ov-btns .bigbtn{min-width:150px}
#deathScreen h2{font-family:Georgia,serif;font-size:46px;color:var(--red);margin-bottom:10px}
#deathScreen img{width:130px;height:215px;object-fit:contain;margin:14px 0}
#deathTip{max-width:520px;color:var(--txt2);font-size:15px;line-height:1.8}
#reviveTop{position:fixed;top:24px;z-index:21;display:none;padding:14px 26px;font-size:17px;font-weight:800;
  background:#3d2a6b;border:1px solid var(--purple)}
#reviveTop.on{display:block}
#reviveTop:disabled{opacity:.4}
#winScreen h2{font-family:Georgia,serif;font-size:52px;color:var(--gold);margin-bottom:16px}
#winScreen .reward{font-size:18px;line-height:2}
#achPop{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:30;background:var(--panel);
  border:1px solid var(--gold);padding:16px 28px;display:none;z-index:30}
#achPop.on{display:block}
#achPop b{color:var(--gold)}
/* ===== 管理員面板 ===== */
#adminPanel{position:fixed;top:90px;right:18px;z-index:25;width:300px;background:rgba(20,17,15,.97);
  border:1px solid #5b3fa8;padding:18px;display:none;flex-direction:column;gap:10px;pointer-events:auto}
#adminPanel.on{display:flex}
#adminPanel h4{font-size:16px;color:#c4b5fd;letter-spacing:2px}
#adminPanel .bigbtn{font-size:14px;padding:10px}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:40;background:#000;
  border:1px solid var(--gold);padding:12px 24px;font-size:15px;display:none}
#toast.on{display:block}
.achicon{width:44px;height:44px;flex:none}
.achline{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:16px}
.achline.locked{opacity:.45}
.achline h3{font-size:16px}.achline p{font-size:13px;color:var(--txt2)}
@media (max-width:640px){
  .setrow{grid-template-columns:1fr}.cards{grid-template-columns:1fr}
  #nsb{width:calc(100vw - 36px)}#inv{gap:4px}.slot{width:56px;height:56px}
}
</style>
</head>
<body>
<div id="webgl"></div>

<!-- ===== 主選單 ===== -->
<div class="screen on" id="menu">
  <div class="menu-wrap">
    <div class="title">The Glitch<small>DOORS 同人樓層</small></div>
    <div class="menubtns">
      <button class="mbtn" id="btnStart">開始遊戲<span class="sub">選擇模式並進入 G-1</span></button>
      <button class="mbtn" id="btnShop">賽前商店<span class="sub">以旋鈕購買入場裝備</span></button>
      <button class="mbtn" id="btnAch">成就<span class="sub">查看已解鎖的成就</span></button>
      <button class="mbtn" id="btnSet">設定<span class="sub">靈敏度、視野、光影與音量</span></button>
    </div>
    <div class="menu-foot">
      目前旋鈕：<b id="menuKnobs">0</b> ｜ 復活心臟：<b id="menuHearts">0</b><br>
      通關普通模式可解鎖管理員面板（反射模式）
    </div>
  </div>
</div>

<!-- ===== 模式選擇 ===== -->
<div class="screen panel-screen" id="modeScreen">
  <div class="panel-head"><button class="back" data-back>返回</button><h2>選擇模式</h2></div>
  <div class="cards" id="modeCards"></div>
</div>

<!-- ===== 商店 ===== -->
<div class="screen panel-screen" id="shopScreen">
<div class="panel-head"><button class="back" data-back>返回</button><h2>賽前商店</h2>
    <span class="chip">旋鈕 <b id="shopKnobs">0</b></span></div>
  <div class="cards" id="shopCards"></div>
</div>

<!-- ===== 成就 ===== -->
<div class="screen panel-screen" id="achScreen">
  <div class="panel-head"><button class="back" data-back>返回</button><h2>成就</h2></div>
  <div style="display:flex;flex-direction:column;gap:12px;max-width:720px" id="achList"></div>
</div>

<!-- ===== 設定 ===== -->
<div class="screen panel-screen" id="setScreen">
  <div class="panel-head"><button class="back" data-back>返回</button><h2>設定</h2></div>
  <div class="setrow"><label>滑鼠靈敏度</label>
    <div class="setline"><input type="range" id="setSens" min="0.2" max="3" step="0.05"><span class="setval" id="valSens"></span></div></div>
  <div class="setrow"><label>視野 FOV</label>
    <div class="setline"><input type="range" id="setFov" min="55" max="95" step="1"><span class="setval" id="valFov"></span></div></div>
  <div class="setrow"><label>陰影</label>
<div class="setline"><button class="toggle" id="setShadow">開啟</button></div></div>
  <div class="setrow"><label>畫質</label>
    <div class="setline"><button class="toggle" id="qLow">低</button><button class="toggle on" id="qHigh">高</button></div></div>
  <div class="setrow"><label>主音量</label>
    <div class="setline"><input type="range" id="setVol" min="0" max="1" step="0.05"><span class="setval" id="valVol"></span></div></div>
</div>

<!-- ===== HUD ===== -->
<div id="hud">

  <div id="topbar">

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
let toastTimer=null;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2200)}
function showScreen(id){

  if(id)$('#'+id).classList.add('on');
}
function rnd(a,b){return a+Math.random()*(b-a)}
function rndInt(a,b){return Math.floor(rnd(a,b+1))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
/* ============================================================
   程序化材質（Canvas 貼圖，無米白純色）
   ============================================================ */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
function tex(c,rx,ry,repeat){
  const t=new THREE.CanvasTexture(c);
  if(repeat!==false){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1)}
  t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;
}
function floorTexture(){
  const [c,g]=cv(512,512);
  g.fillStyle='#332216';g.fillRect(0,0,512,512);
  // 人字拼木地板
  const cols=['#2c1d12','#3a2719','#45301f','#382417','#4b3524'];
  for(let y=-64;y<576;y+=32){
    for(let x=-64;x<576;x+=64){
      const flip=((x+y)/32)%2===0;
      g.save();g.translate(x+32,y+16);g.rotate(flip?Math.PI/4:-Math.PI/4);
      g.fillStyle=cols[rndInt(0,4)];g.fillRect(-26,-10,52,20);
      g.strokeStyle='rgba(0,0,0,.35)';g.strokeRect(-26,-10,52,20);
      g.strokeStyle='rgba(255,220,170,.06)';
      for(let i=0;i<3;i++){g.beginPath();g.moveTo(-22,-6+i*7);g.lineTo(22,-6+i*7);g.stroke()}
      g.restore();
    }
  }
  g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=2;
  for(let i=0;i<=512;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,512);g.stroke()}
  return tex(c,3,4);
}
function wallTexture(){
  const [c,g]=cv(512,512);
  // 上半部：深綠壁紙
  g.fillStyle='#243a2e';g.fillRect(0,0,512,320);
  g.strokeStyle='rgba(200,220,200,.07)';g.lineWidth=1.5;
  for(let y=24;y<320;y+=48)for(let x=24;x<512;x+=48){
g.beginPath();g.moveTo(x,y-10);g.lineTo(x+10,y);g.lineTo(x,y+10);g.lineTo(x-10,y);g.closePath();g.stroke();
  }
  for(let i=0;i<900;i++){g.fillStyle='rgba(0,0,0,'+rnd(.02,.08)+')';g.fillRect(rnd(0,512),rnd(0,320),2,2)}
  // 護牆板分隔線
  g.fillStyle='#5a4128';g.fillRect(0,316,512,8);
  g.fillStyle='rgba(255,220,170,.18)';g.fillRect(0,316,512,2);
  // 下半部：木護牆
  g.fillStyle='#2e1f14';g.fillRect(0,324,512,188);
  for(let x=0;x<512;x+=86){
    g.fillStyle='#372517';g.fillRect(x+6,334,74,168);
    g.strokeStyle='rgba(0,0,0,.5)';g.strokeRect(x+6,334,74,168);
    g.strokeStyle='rgba(255,220,170,.08)';g.strokeRect(x+10,338,66,160);
  }
  for(let i=0;i<400;i++){g.fillStyle='rgba(0,0,0,'+rnd(.02,.07)+')';g.fillRect(rnd(0,512),rnd(324,512),2,2)}
  return tex(c,2,1);
}
function ceilingTexture(){
  const [c,g]=cv(512,512);
  g.fillStyle='#24170e';g.fillRect(0,0,512,512);
  for(let y=0;y<512;y+=52){
    g.fillStyle=['#2a1b10','#22150c','#2f1f13'][rndInt(0,2)];g.fillRect(0,y,512,50);
    g.strokeStyle='rgba(0,0,0,.6)';g.beginPath();g.moveTo(0,y);g.lineTo(512,y);g.stroke();
g.strokeStyle='rgba(255,220,170,.05)';
    for(let i=0;i<6;i++){g.beginPath();g.moveTo(0,y+8+i*7);g.lineTo(512,y+8+i*7);g.stroke()}
  }
  return tex(c,2,3);
}
function doorTexture(){
  const [c,g]=cv(256,512);
  g.fillStyle='#3a2415';g.fillRect(0,0,256,512);
  for(let i=0;i<14;i++){g.strokeStyle='rgba(0,0,0,'+rnd(.1,.3)+')';g.beginPath();g.moveTo(rnd(0,256),0);g.lineTo(rnd(0,256),512);g.stroke()}
  const panel=(y)=>{g.fillStyle='#2e1c10';g.fillRect(28,y,200,180);g.strokeStyle='#1a1008';g.lineWidth=6;g.strokeRect(28,y,200,180);
    g.strokeStyle='rgba(255,220,170,.1)';g.lineWidth=2;g.strokeRect(38,y+10,180,160)}
  panel(36);panel(296);
  g.fillStyle='#5a4128';g.fillRect(0,0,14,512);g.fillRect(242,0,14,512);
  return tex(c,1,1,false);
}
function plateTexture(n){

  g.fillStyle='#d9b36a';g.font='bold 62px Georgia';g.textAlign='center';g.textBaseline='middle';
g.fillText('G-'+n,128,68);

function rugTexture(){

const matWood=new THREE.MeshStandardMaterial({color:0x4a3322,roughness:.8});
const matCrate=new THREE.MeshStandardMaterial({color:0x5d4128,roughness:.88});
const matMetal=new THREE.MeshStandardMaterial({color:0x3a3f47,roughness:.45,metalness:.75});

/* ============================================================
   房間生成與串流
   ============================================================ */
const activeRooms=new Map();   // n -> room data
let blockers=[];                // 會擋光線/視線的牆網格
const interactives=[];          // 可互動網格
function box(w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;
}
function buildRoom(n){
  const zS=-(n-1)*RL, zE=-n*RL, zC=(zS+zE)/2;
  const g=new THREE.Group();
  const data={n,group:g,colliders:[],light:null,door:null,doorOpen:false,doorOpening:false,pickups:[]};

  // 地板 / 天花板
  const fl=box(RW,.2,RL,matFloor,0,-.1,zC);fl.castShadow=false;fl.receiveShadow=true;g.add(fl);
  const ce=box(RW,.2,RL,matCeil,0,RH+.1,zC);ce.castShadow=false;g.add(ce);
  // 側牆
  const wL=box(WALL,RH,RL,matWall,-RW/2-WALL/2,RH/2,zC);
  const wR=box(WALL,RH,RL,matWall,RW/2+WALL/2,RH/2,zC);
  g.add(wL,wR);wL.userData.blocker=wR.userData.blocker=true;blockers.push(wL,wR);
  // 端牆（入口處僅 G-1 建；出口處每間都建，留門洞）
  const ends=n===1?[zS,zE]:[zE];
  ends.forEach(z=>{
    const sideW=(RW-DW)/2;
    const p1=box(sideW,RH,WALL,matWall,-DW/2-sideW/2,RH/2,z);
    const p2=box(sideW,RH,WALL,matWall,DW/2+sideW/2,RH/2,z);
    const top=box(DW+WALL*2,RH-DH,WALL,matWall,0,DH+(RH-DH)/2,z);
    g.add(p1,p2,top);[p1,p2,top].forEach(m=>{m.userData.blocker=true;blockers.push(m)});
});

  // 門（含門牌）
  const pivot=new THREE.Group();pivot.position.set(-DW/2,0,zE);
  const door=new THREE.Mesh(new THREE.BoxGeometry(DW,DH,.14),matDoor);
  door.position.set(DW/2,DH/2,0);door.castShadow=true;
  door.userData={type:'door',room:n};pivot.add(door);
  const plate=new THREE.Mesh(new THREE.PlaneGeometry(.95,.48),
    new THREE.MeshStandardMaterial({map:plateTexture(n+1),roughness:.6}));
  plate.position.set(DW/2,2.3,.09);pivot.add(plate);
  g.add(pivot);
  data.door=door;data.pivot=pivot;
  door.userData.blocker=true;blockers.push(door);
  interactives.push(door);

  // 吊燈
  const chain=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.7),matMetal);
  chain.position.set(0,RH-.35,zC);g.add(chain);
  const lamp=new THREE.Mesh(new THREE.SphereGeometry(.35,12,10),
    new THREE.MeshStandardMaterial({color:0xffe6b0,emissive:0xffc878,emissiveIntensity:1.4}));
  lamp.position.set(0,RH-.75,zC);g.add(lamp);
  const pl=new THREE.PointLight(0xffd9a0,0,22,1.8);
  pl.position.set(0,RH-1,zC);pl.castShadow=false;g.add(pl);data.light=pl;
// 衣櫃（每間都放，保證刷怪房一定有柜子）
  const side=Math.random()<.5?-1:1;
  const closet=new THREE.Group();
  const cBody=box(1.7,2.5,.9,matCloset,0,1.25,0);closet.add(cBody);
  const cDoor1=box(.82,2.3,.06,matWood,-.42,1.25,.46);
  const cDoor2=box(.82,2.3,.06,matWood,.42,1.25,.46);
  closet.add(cDoor1,cDoor2);
  closet.position.set(side*(RW/2-1),0,zC+RL/2-2.2);
  const cHit=new THREE.Mesh(new THREE.BoxGeometry(1.9,2.6,1.1),
    new THREE.MeshBasicMaterial({visible:false}));
  cHit.position.copy(closet.position);cHit.userData={type:'closet',room:n,side};
  g.add(closet,cHit);interactives.push(cHit);
  data.colliders.push({x1:closet.position.x-.95,z1:closet.position.z-.55,x2:closet.position.x+.95,z2:closet.position.z+.55});

  // 隨機家具
  const furnCount=rndInt(1,3);
  for(let i=0;i<furnCount;i++){
    const fx=rnd(-4.5,4.5),fz=rnd(zS+3,zE-3);
    if(Math.abs(fx-closet.position.x)<1.6&&Math.abs(fz-closet.position.z)<2)continue;
    const kind=rndInt(0,2);
    let fw=1.4,fd=1.4;
    if(kind===0){const cr=box(1.4,1.4,1.4,matCrate,fx,.7,fz);g.add(cr)}
else if(kind===1){fw=3;fd=1.1;const co=box(3,1,1.1,matWood,fx,.5,fz);
      const back=box(3,1.2,.3,matWood,fx,1.1,fz-.45);g.add(co,back)}
    else{const rug=new THREE.Mesh(new THREE.PlaneGeometry(3.4,2.2),
      new THREE.MeshStandardMaterial({map:rugTexture(),roughness:.95}));
      rug.rotation.x=-Math.PI/2;rug.position.set(fx,.02,fz);g.add(rug);continue}
    data.colliders.push({x1:fx-fw/2,z1:fz-fd/2,x2:fx+fw/2,z2:fz+fd/2});
  }

  // 拾取物：電池 / 旋鈕
  const pkCount=rndInt(0,2);
  for(let i=0;i<pkCount;i++){
    const px=rnd(-5,5),pz=rnd(zS+3,zE-3),isBatt=Math.random()<.45;
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(.28,.28,.28),
      new THREE.MeshStandardMaterial({color:isBatt?0x22c55e:0xd9a441,
        emissive:isBatt?0x0f5132:0x6b4d12,emissiveIntensity:.9}));
    m.position.set(px,.4,pz);
    m.userData={type:isBatt?'battery':'knob',value:isBatt?0:rndInt(10,40),taken:false,baseY:.4};
    g.add(m);interactives.push(m);data.pickups.push(m);
  }

  scene.add(g);activeRooms.set(n,data);return data;
}
function disposeRoom(n){
  const d=activeRooms.get(n);if(!d)return;
  scene.remove(d.group);
  d.group.traverse(o=>{if(o.geometry)o.geometry.dispose()});
  blockers=blockers.filter(b=>!d.group.children.includes(b)&&b!==d.door);
  activeRooms.delete(n);
}
function ensureRooms(cur){
  const lo=Math.max(1,cur-1),hi=cur+2;
  for(let n=lo;n<=hi;n++)if(!activeRooms.has(n))buildRoom(n);
  Array.from(activeRooms.keys()).forEach(n=>{if(n<lo||n>hi)disposeRoom(n)});
  // 互動列表重建（移除已卸載房間的物件）
  for(let i=interactives.length-1;i>=0;i--){
    const m=interactives[i];let alive=false;
    activeRooms.forEach(d=>{if(d.group===m||(m.parent&&d.group.children.includes(m.parent))||d.pickups.includes(m))alive=true});
    if(!alive)interactives.splice(i,1);
  }
  // 僅當前與下一間亮燈，其餘滅燈，控制光源數量
  activeRooms.forEach(d=>{
    d.light.visible=(d.n===cur||d.n===cur+1);
    d.light.castShadow=(d.n===cur&&SAVE.settings.shadow);
  });
}
/* ============================================================
   遊戲狀態 / 玩家控制
   ============================================================ */
const G={
 running:false,mode:null,floor:1,hp:100,shield:0,
 yaw:0,pitch:0,vx:0,vz:0,
 inventory:[],selected:0,flashOn:false,battery:100,
 speedBuff:0,speedMult:1,hidden:false,anchor:new THREE.Vector3(0,1.7,3),
 warning:null,monsters:[],dead:false,won:false,bobT:0
};
const keys={};
const RAY=new THREE.Raycaster();RAY.far=3.2;
const WALK=4.3, SPRINT=6.6, PR=.42;

/* ---------- 音效（WebAudio 簡易合成） ---------- */
let AC=null,masterGain=null,noiseSrc=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain();masterGain.gain.value=SAVE.settings.vol;
    masterGain.connect(AC.destination);
    const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=buf.getChannelData(0);let last=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
    noiseSrc=AC.createBufferSource();noiseSrc.buffer=buf;noiseSrc.loop=true;
    const nf=AC.createBiquadFilter();nf.type='lowpass';nf.frequency.value=110;
const ng=AC.createGain();ng.gain.value=.5;
    noiseSrc.connect(nf);nf.connect(ng);ng.connect(masterGain);noiseSrc.start();
  }catch(e){AC=null}
}
function blip(freq,dur,type,vol){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.25,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.connect(g);g.connect(masterGain);o.start();o.stop(AC.currentTime+dur);
}
function setVol(v){if(masterGain)masterGain.gain.value=v}

/* ---------- 指標鎖定 ---------- */
function lockPointer(){renderer.domElement.requestPointerLock&&renderer.domElement.requestPointerLock()}
document.addEventListener('pointerlockchange',()=>{
  if(document.pointerLockElement!==renderer.domElement&&G.running&&!G.dead&&!G.won){
    $('#pauseScreen').classList.add('on');
  }else $('#pauseScreen').classList.remove('on');
});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==renderer.domElement||!G.running)return;
const k=SAVE.settings.sens*.0021;
  G.yaw-=e.movementX*k;G.pitch-=e.movementY*k;
  G.pitch=clamp(G.pitch,-1.45,1.45);
});
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(!G.running)return;
  if(e.code==='KeyF')useSelected();
  if(e.code.startsWith('Digit')){const i=+e.code.slice(5)-1;if(i<G.inventory.length)G.selected=i}
});
addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('wheel',e=>{
  if(!G.running||!G.inventory.length)return;
  G.selected=(G.selected+(e.deltaY>0?1:-1)+G.inventory.length)%G.inventory.length;
},{passive:true});
renderer&&renderer.domElement.addEventListener('click',()=>{
  if(G.running&&document.pointerLockElement!==renderer.domElement&&!G.dead&&!G.won)lockPointer();
});

/* ---------- 碰撞 ---------- */
function roomAt(z){return clamp(Math.floor(-z/RL)+1,1,150)}
function resolveCollisions(px,pz){
  let n=roomAt(pz);
  const lim=RW/2-.4;
  px=clamp(px,-lim,lim);
  const cur=roomAt(camera.position.z);
  const planes=[];
  if(activeRooms.has(cur))planes.push({z:-cur*RL,open:activeRooms.get(cur).doorOpen});
if(cur>1&&activeRooms.has(cur-1))planes.push({z:-(cur-1)*RL,open:activeRooms.get(cur-1).doorOpen});
  for(const pl of planes){
    if((camera.position.z>pl.z&&pz<=pl.z)||(camera.position.z<pl.z&&pz>=pl.z)){
      if(!pl.open){pz=camera.position.z}
    }
  }
  activeRooms.forEach(d=>{
    for(const c of d.colliders){
      const cx=clamp(px,c.x1,c.x2),cz=clamp(pz,c.z1,c.z2);
      let dx=px-cx,dz=pz-cz,len=Math.hypot(dx,dz);
      if(len<PR){
        if(len<.0001){px=c.x1-PR;continue}
        const push=(PR-len)/len;px+=dx*push;pz+=dz*push;
      }
    }
  });
  return {x:px,z:pz};
}

/* ---------- 玩家更新 ---------- */
function updatePlayer(dt){
  if(G.hidden){
    const t=activeRooms.get(G.floor);
    if(t){const c=t.colliders[0];
      const tx=clamp(c.x1+.5,-RW/2+1,RW/2-1),tz=c.z1+.2;
      camera.position.x+=(tx-camera.position.x)*Math.min(1,dt*8);
      camera.position.z+=(tz-camera.position.z)*Math.min(1,dt*8);
    }
    camera.rotation.order='YXZ';camera.rotation.set(0,G.yaw,0);
    return;
}
  let speed=(keys.ShiftLeft||keys.ShiftRight?SPRINT:WALK);
  speed*=G.mode.speedMult*G.speedMult;
  let ix=0,iz=0;
  if(keys.KeyW)iz-=1;if(keys.KeyS)iz+=1;if(keys.KeyA)ix-=1;if(keys.KeyD)ix+=1;
  const l=Math.hypot(ix,iz)||1;
  const sin=Math.sin(G.yaw),cos=Math.cos(G.yaw);
  const wx=(ix*cos-iz*sin)/l,wz=(ix*sin+iz*cos)/l;
  const accel=10*dt;
  G.vx+=wx*speed*accel;G.vz+=wz*speed*accel;
  G.vx*=Math.pow(.0008,dt);G.vz*=Math.pow(.0008,dt);
  const sp=Math.hypot(G.vx,G.vz);
  if(sp>speed){G.vx*=speed/sp;G.vz*=speed/sp}
  let nx=camera.position.x+G.vx*dt,nz=camera.position.z+G.vz*dt;
  const r=resolveCollisions(nx,nz);
  camera.position.x=r.x;camera.position.z=r.z;
  if(sp>.6){G.bobT+=dt*sp*1.7}
  camera.position.y=1.7+Math.sin(G.bobT*2)*.055;
  camera.rotation.order='YXZ';
  camera.rotation.y=G.yaw;camera.rotation.x=G.pitch;
  const targetFov=SAVE.settings.fov+(sp>WALK*1.05?8:0);
  if(Math.abs(camera.fov-targetFov)>.1){camera.fov+=(targetFov-camera.fov)*dt*8;camera.updateProjectionMatrix()}
if(camera.position.y<-2||Math.abs(camera.position.x)>RW/2+.6){
    glitchReset();return;
  }
  const nf=roomAt(camera.position.z);
  if(nf!==G.floor)enterFloor(nf);
  if(G.flashOn){
    G.battery=Math.max(0,G.battery-dt*1.35);
    if(G.battery<=0)setFlash(false);
  }
  if(G.speedBuff>0){G.speedBuff-=dt;if(G.speedBuff<=0)G.speedMult=1}
}
function glitchReset(){
  camera.position.copy(G.anchor);G.vx=G.vz=0;
  flashScreen();toast('Glitch 已將你重置到上一個房間（物品保留）');
  blip(90,.3,'sawtooth',.3);
}
function flashScreen(){
  const el=$('#glitchFlash');el.style.transition='none';el.style.opacity=.8;
  requestAnimationFrame(()=>{el.style.transition='opacity .7s';el.style.opacity=0});
}

/* ---------- 進入樓層 ---------- */
function enterFloor(n){
  G.floor=n;
  G.anchor.set(camera.position.x,1.7,camera.position.z);
  if(n>=150){winGame();return}
  maybeSpawn(n);
}

/* ---------- 互動 ---------- */
function updatePrompt(){
  const p=$('#prompt');
  if(G.hidden){p.classList.add('on');p.innerHTML='按 <b>E</b> 離開衣櫃';return}
RAY.setFromCamera({x:0,y:0},camera);
  const hits=RAY.intersectObjects(interactives,false).filter(h=>h.distance<=3.2);
  if(!hits.length){p.classList.remove('on');return}
  const ud=hits[0].object.userData;
  if(ud.type==='door'){p.classList.add('on');p.innerHTML='按 <b>E</b> 開門 <b>G-'+(ud.room+1)+'</b>'}
  else if(ud.type==='closet'){p.classList.add('on');p.innerHTML='按 <b>E</b> 躲進衣櫃'}
  else if(ud.type==='battery'&&!ud.taken){p.classList.add('on');p.innerHTML='按 <b>E</b> 拾取電池（手電筒 +35）'}
  else if(ud.type==='knob'&&!ud.taken){p.classList.add('on');p.innerHTML='按 <b>E</b> 拾取 <b>'+ud.value+'</b> 旋鈕'}
  else p.classList.remove('on');
}
function interact(){
  if(G.hidden){G.hidden=false;return}
  RAY.setFromCamera({x:0,y:0},camera);
  const hits=RAY.intersectObjects(interactives,false).filter(h=>h.distance<=3.2);
  if(!hits.length)return;
  const m=hits[0].object,ud=m.userData;
  if(ud.type==='door')openDoor(ud.room);
  else if(ud.type==='closet'){G.hidden=true;blip(180,.15,'triangle',.2)}
else if(ud.type==='battery'&&!ud.taken){
    ud.taken=true;m.visible=false;
    G.battery=Math.min(100,G.battery+35);
    toast('手電筒電力 +35');blip(520,.1,'sine',.2);
  }else if(ud.type==='knob'&&!ud.taken){
    ud.taken=true;m.visible=false;
    SAVE.knobs+=ud.value;persist();
    toast('獲得 '+ud.value+' 旋鈕');blip(660,.1,'sine',.2);
  }
}

/* ============================================================
   怪物系統：Rush / Ambush / Glitch
   ============================================================ */
const TIPS=[
 'Rush 來襲前會有紫色粒子與 10 秒預警，立刻進入衣櫃躲藏。',
 'Ambush 會來回衝 1 到 3 次，紅色粒子出現後躲好，別急著出來。',
 'Rush 的光照半徑 30 米，光線會被牆壁遮擋，隔牆房間是安全的。',
 '星光桶的 1000 點保護可擋下 Rush 的一次光照（扣 100 點保護）。',
 '卡出地圖時，我會把你重置到上一個房間，物品不會消失。',
 'Ambush 不能撞開門，關上的門會讓它折返。'
];
function maybeSpawn(floor,fromRush){
  if(floor<60)return;                 // Rush / Ambush 不得在 G-60 前出現
  // Rush 撞開門引發的再次召喚，不受當前怪物忙碌狀態限制
  if(!fromRush&&(G.warning||G.monsters.length))return;
  if(Math.random()>=G.mode.spawn)return;
  const type=Math.random()<.2?'ambush':'rush';
  startWarning(type);
}
function startWarning(type,force){
  const dur=type==='rush'?10:3;
  G.warning={type,t:0,dur};
  const color=type==='rush'?'#8b5cf6':'#ef4444';
  startParticles(color);
const wt=$('#warnTxt');
  wt.textContent=(type==='rush'?'Rush':'Ambush')+' 即將來襲';
  wt.style.color=color;wt.classList.add('on');
  if(SAVE.secretOwned){
    $('#nsbBody').innerHTML=type==='rush'
      ?'<b style="color:#8b5cf6">Rush</b>：'+dur+' 秒後沿走廊高速衝刺，光照半徑 30 米。<br>躲避：立即進入衣櫃，或待在牆後無視線房間。'
      :'<b style="color:#ef4444">Ambush</b>：'+dur+' 秒後來回衝刺 1-3 次，攻擊範圍極遠。<br>躲避：躲入衣櫃並等它完全消失。';
  }
  // 預警心跳
  let n=0;const iv=setInterval(()=>{blip(70,.12,'sine',.3);if(++n>dur||!G.warning)clearInterval(iv)},1000);
}
function updateWarning(dt){
  if(!G.warning)return;
  G.warning.t+=dt;
  if(G.warning.t>=G.warning.dur){
    const type=G.warning.type;G.warning=null;
    $('#warnTxt').classList.remove('on');stopParticles();
    spawnMonster(type);
  }
}
function faceMat(url){
  return new THREE.MeshStandardMaterial({
    map:new THREE.TextureLoader().setCrossOrigin('anonymous').load(url),
    transparent:true,emissive:0xffffff,emissiveMap:null,emissiveIntensity:.35,
    roughness:.4,side:THREE.DoubleSide,depthTest:!SAVE.secretOwned
});
}
function spawnMonster(type){
  const grp=new THREE.Group();
  const face=new THREE.Mesh(new THREE.PlaneGeometry(3.2,3.2),faceMat(IMG[type]));
  face.position.y=2.4;grp.add(face);
  const light=new THREE.PointLight(type==='rush'?0x8b5cf6:0xef4444,3.4,type==='rush'?30:40,1.8);
  light.position.y=2.4;grp.add(light);
  const m={type,group:grp,face,light,hit:false,bounces:0,maxBounce:type==='ambush'?rndInt(1,3):0,doors:0,passed:[]};
  if(type==='rush'){
    grp.position.set(0,0,camera.position.z+18);
    m.speed=16;m.dir=-1;m.range=30;
  }else{
    grp.position.set(0,0,camera.position.z-16);
    m.speed=24;m.dir=1;m.range=40;
    m.zA=camera.position.z-16;m.zB=camera.position.z+10;
  }
  scene.add(grp);G.monsters.push(m);
  blip(200,.5,'sawtooth',.3);
}
function losBlocked(m){
  const from=new THREE.Vector3(0,2.4,m.group.position.z);
  const to=camera.position.clone();to.y=1.7;
  const rc=new THREE.Raycaster(from,to.clone().sub(from).normalize(),0,from.distanceTo(to));
  const bs=blockers.filter(b=>b.visible);
return rc.intersectObjects(bs,false).length>0;
}
function updateMonsters(dt){
  for(let i=G.monsters.length-1;i>=0;i--){
    const m=G.monsters[i];
    m.group.position.z+=m.dir*m.speed*dt;
    const z=m.group.position.z;
    if(m.type==='rush'){
      // 撞門：開門並計數
      activeRooms.forEach(d=>{
        if(!d.doorOpen&&!d.doorOpening){
          const plane=-d.n*RL;
          if(Math.abs(z-plane)<.5){d.doorOpening=true;d.rushOpened=true}
        }
      });
      let gone=false;
      for(let k=G.floor;k<=G.floor+2;k++){
        if(!m.passed.includes(k)&&z<-k*RL){
          m.passed.push(k);
          if(m.passed.length>=2){removeMonster(i);gone=true;break}
        }
      }
      if(gone)continue;
    }else{
      // Ambush 折返：邊界或關閉的門
      let turn=false;
      if((m.dir<0&&z<=m.zA)||(m.dir>0&&z>=m.zB))turn=true;
      activeRooms.forEach(d=>{
        if(!d.doorOpen){const plane=-d.n*RL;if(Math.abs(z-plane)<.4)turn=true}
      });
      if(turn){m.dir*=-1;m.bounces++;m.hit=false;if(m.bounces>m.maxBounce){removeMonster(i);continue}}
}
    // 攻擊判定
    if(!G.hidden){
      const dist=Math.hypot(camera.position.x-m.group.position.x,camera.position.z-z);
      if(dist<=m.range&&!losBlocked(m)&&!m.hit){
        m.hit=true;
        if(G.shield>=100){
          G.shield-=100;toast('保護抵擋了攻擊（-100 保護）');blip(300,.2,'square',.25);
        }else killPlayer(m.type);
      }
    }
  }
}
function removeMonster(i){
  const m=G.monsters[i];
  scene.remove(m.group);
  m.face.material.map&&m.face.material.map.dispose();
  m.face.material.dispose();
  G.monsters.splice(i,1);
}

   ============================================================ */
const pc=$('#particles'),pctx=pc.getContext('2d');
let particles=[],pColor='#8b5cf6',pActive=false;
function sizePC(){pc.width=innerWidth;pc.height=innerHeight}
sizePC();addEventListener('resize',sizePC);
function startParticles(c){pColor=c;pActive=true;pc.classList.add('on');particles=[]}
function stopParticles(){pActive=false;pc.classList.remove('on');particles=[]}
function updateParticles(){
  if(!pActive)return;
  if(particles.length<160){
    const edge=rndInt(0,3),W=pc.width,H=pc.height;
    let x,y;
    if(edge===0){x=rnd(0,W);y=0}else if(edge===1){x=W;y=rnd(0,H)}
else if(edge===2){x=rnd(0,W);y=H}else{x=0;y=rnd(0,H)}
    const cx=W/2,cy=H/2,a=Math.atan2(cy-y,cx-x);
    particles.push({x,y,vx:Math.cos(a)*rnd(1.5,3.5),vy:Math.sin(a)*rnd(1.5,3.5),life:1,s:rnd(2,5)});
  }
  pctx.clearRect(0,0,pc.width,pc.height);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life-=.012;
    pctx.globalAlpha=clamp(p.life,0,1);pctx.fillStyle=pColor;
    pctx.fillRect(p.x,p.y,p.s,p.s);
  });
  pctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
}
